# One-command demo stack: PostgreSQL 16, the demo organisation "Safarov Industries" and the portal on
# http://localhost:3000. From the repository root:
#
#   cp portal/.env.demo.example portal/.env.demo      (and set its three values)
#   docker compose --env-file portal/.env.demo -f portal/docker-compose.demo.yml up --build
#
# Then follow docs/DEMO.md. THROWAWAY ONLY: the seed empties every table each time the stack starts. No
# secret lives in this file: APP_SECRET, POSTGRES_PASSWORD and SEED_PASSWORD come from .env.demo (gitignored)
# and the stack refuses to start without them. For a real installation use docker-compose.yml (README,
# "Production with Docker"). `docker compose --env-file portal/.env.demo -f portal/docker-compose.demo.yml down -v`
# removes it all, the database volume included (down interpolates the file too, so it needs the env file).
name: cyclowareness-demo

x-demo-env: &demo-env
  DATABASE_URL: postgres://portal:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in portal/.env.demo}@db:5432/portal
  APP_URL: http://localhost:3000
  # Plain HTTP on loopback is fine for a laptop demo; a real installation needs https://.
  ALLOW_HTTP_APP_URL: "1"
  APP_SECRET: ${APP_SECRET:?set APP_SECRET in portal/.env.demo (32+ random characters)}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in portal/.env.demo}
      POSTGRES_DB: portal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal"]
      interval: 3s
      timeout: 5s
      retries: 20

  # Applies the migrations, then loads the demo organisation (fictional people, 60 days of history, the
  # live_drill feature switched on). Runs once per `up`; the portal waits for it.
  seed:
    build:
      context: .
      target: builder
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *demo-env
      ALLOW_SEED: "1"
      # Password of every demo account; required here so it never appears in the stack's logs.
      SEED_PASSWORD: ${SEED_PASSWORD:?set SEED_PASSWORD in portal/.env.demo (12+ characters)}
    user: node
    command: ["sh", "-c", "npx tsx scripts/migrate.ts && npx tsx scripts/seed.ts"]

  app:
    build: .
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      <<: *demo-env
      JOBS_ENABLED: "1"
      TRUST_PROXY: "0"
    ports:
      - "127.0.0.1:3000:3000"
