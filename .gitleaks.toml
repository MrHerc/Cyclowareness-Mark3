# Secret scanning rules for .github/workflows/security.yml: gitleaks' default rules plus the few
# values in this repository that look like secrets but are public on purpose. Add to this list only
# values that are not secrets; a real secret that was committed must be rotated, not allowed here.
title = "Cyclowareness"

[extend]
useDefault = true

[[allowlists]]
description = "Public placeholders: test-only and development-only APP_SECRET values"
regexTarget = "secret"
regexes = [
  # tests/*.test.ts stub APP_SECRET with these.
  '''test-only-app-secret''',
  # src/server/crypto.ts and src/server/env.ts use this outside production only; production refuses to start without APP_SECRET.
  '''^dev-only-secret-change-me''',
]

[[allowlists]]
description = "Commits that carried the former demo seed password before it was removed on 2026-11-05 (.env.example, seed scripts, audit and register documents); the value is no longer anywhere in the tree and the seed now prints a random password"
commits = [
  "3c2367df03822817f4bded2e2bc616b22311fcbc",
  "a4ed78a8a22ccc3e92417b7ac66a17ee744b162b",
  "6cd9ea31f3ee0eece4d941b7aa65fd359baa2845",
  "97d4d943fe49a39988af185d9b8af8fee8e0027d",
  "f9771ee50bea1ea18824ab88a8768cf7ebbf64da",
]
